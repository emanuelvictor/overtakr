<product-form [entity]='product' (save)='save($event)'>

  <div class='toolbar' fxLayout='row' fxFlex toolbar>
    <div fxLayout='column'>
      <div class='headline' [innerHTML]="'Produto'"></div>
      <div class='subhead' [innerHTML]="'Produto / Adicionar'"></div>
    </div>
    <div fxLayout='row' fxLayoutAlign='end center' fxFlex>
      <button mat-raised-button type='button' routerLink='../'>
        <mat-icon>arrow_back</mat-icon>
        <span>Voltar</span>
      </button>
      <horizontal-space></horizontal-space>
      <button mat-raised-button color='primary'>
        <mat-icon>save</mat-icon>
        <span>Salvar</span>
      </button>
    </div>
  </div>

</product-form>
